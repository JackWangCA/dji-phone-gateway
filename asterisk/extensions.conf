[general]
static=yes
writeprotect=no

[globals]
IPHONE_ENDPOINT=iphone

[cellular-incoming]
exten => s,1,NoOp(Incoming cellular call from ${CALLERID(num)})
 same => n,Dial(PJSIP/${IPHONE_ENDPOINT},45)
 same => n,Hangup()

exten => sms,1,NoOp(Incoming SMS from ${CALLERID(num)})
 same => n,Set(SMS_TEXT=${JSON_DECODE(SMS,msg)})
 same => n,AGI(telegram-notify)
 same => n,Hangup()

[iphone-outbound]
; Emergency dialing is deliberately not supported by this hobby gateway.
exten => 911,1,Playback(auth-incorrect)
 same => n,Hangup()
exten => 112,1,Playback(auth-incorrect)
 same => n,Hangup()
exten => _+X.,1,Dial(Quectel/quectel0/${EXTEN},90)
 same => n,Hangup()
exten => _X.,1,Dial(Quectel/quectel0/${EXTEN},90)
 same => n,Hangup()
