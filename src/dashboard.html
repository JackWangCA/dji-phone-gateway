}

html,body{height:100%}
body{background:var(--bg);color:var(--label);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

const S={tab:location.hash==='#status'?'status':location.hash==='#settings'?'settings':location.hash==='#forwarding'?'forwarding':'messages',q:'',filter:'all',read:readLocal('dji-read-v1',{}),manualUnread:readLocal('dji-unread-v1',{}),theme:readLocal('dji-theme','auto'),sheet:null,peer:null,busy:false};

function date(v){const text=String(v);return new Date(text.replace(' ','T')+(text.includes('T')?'':'Z'))}
function time(v){const d=date(v);if(Number.isNaN(d.getTime()))return v;return d.toDateString()===new Date().toDateString()?d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})}

function groups(){const m=new Map();for(const x of [...allMessages,...pending]){if(!m.has(x.peer))m.set(x.peer,[]);m.get(x.peer).push(x)}return [...m.entries()].map(([peer,items])=>({peer,items,last:items.at(-1)})).sort((a,b)=>Number(b.last.id)-Number(a.last.id))}

function renderNav(){const items=[['messages','Messages','msg'],['forwarding','Forwarding','rules'],['status','Status','pulse'],['settings','Settings','gear']];document.getElementById('nav').innerHTML=items.map(([key,label,i])=>`<button class="nav-btn" data-tab="${key}" data-view="${key==='messages'?'conversations':key}" aria-selected="${S.tab===key}" ${S.tab===key?'aria-current="page"':''}>${svg(i)}<span>${label}</span>${key==='messages'&&unreadCount()?`<b class="badge">${unreadCount()}</b>`:''}</button>`).join('')}
function conversationCard(c){const hash=[...c.peer].reduce((sum,x)=>sum+x.charCodeAt(0),0),isUnread=unread(c),readLabel=isUnread?'Mark read':'Mark unread';return `<div class="convo-card" data-peer="${esc(c.peer)}"><div class="swipe-action read" aria-hidden="true"><button type="button" tabindex="-1" data-toggle-read="${esc(c.peer)}" aria-label="${readLabel}: ${esc(phone(c.peer))}">${isUnread?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3V10Zm0 0 9 6 9-6M3 20l6-6m12 6-6-6"/></svg>':svg('mail')}<span>${readLabel}</span></button></div><div class="swipe-action delete" aria-hidden="true"><button type="button" tabindex="-1" data-delete-peer="${esc(c.peer)}" aria-label="Delete conversation: ${esc(phone(c.peer))}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg><span>Delete</span></button></div><button class="row convo" data-open="${esc(c.peer)}" aria-describedby="conversation-swipe-help"><span class="avatar" style="background:${colors[hash%colors.length]}">${esc(c.peer.replace(/[^A-Za-z0-9]/g,'').slice(-2)||'#')}</span><span class="grow"><span class="top"><span class="t">${esc(phone(c.peer))}</span><span class="meta">${esc(time(c.last.timestamp))}</span></span><span class="s">${esc((c.last.direction==='outgoing'?'You: ':'')+c.last.body)}</span><span class="tag">${c.last.pending?'Sending…':c.last.direction==='outgoing'?'Sent SMS':'Received SMS'}</span></span>${isUnread?'<span class="dot" aria-label="Unread"></span>':''}</button></div>`}
function messagesView(){const q=S.q.toLowerCase();const entries=groups().filter(c=>(S.filter==='all'||S.filter==='unread'&&unread(c)||S.filter==='sent'&&c.items.some(m=>m.direction==='outgoing'))&&(!q||phone(c.peer).toLowerCase().includes(q)||c.items.some(m=>m.body.toLowerCase().includes(q))));return `<div class="page"><div class="page-heading"><h1>Messages</h1><button id="new-message" class="compose" aria-label="New message"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div><label class="search">${svg('search')}<input id="conversation-search" type="search" placeholder="Search" value="${esc(S.q)}" aria-label="Search messages"></label><div class="seg" role="group" aria-label="Filter">${['all','unread','sent'].map(f=>`<button data-filter="${f}" aria-pressed="${S.filter===f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div><p id="conversation-swipe-help" class="sr-only">Swipe right to toggle read or unread. Swipe left to delete. With a keyboard, use the right or left arrow to reveal the action, then Tab to its button.</p>${entries.length?`<div class="group">${entries.map(conversationCard).join('')}</div>`:`<div class="empty">${S.q||S.filter!=='all'?'No messages match. Try a different search or filter.':'No messages yet. Incoming SMS and messages you send will appear here.'}</div>`}</div>`}

function statusView(){const online=!!status.registered;const bars=[8,12,16,22].map((h,i)=>`<i style="height:${h}px" class="${Number(status.signal)>i*25?'on':''}"></i>`).join('');const incoming=allMessages.filter(m=>m.direction==='incoming').length,outgoing=allMessages.length-incoming;const services=Object.entries(status.services||{}),active=services.filter(([,v])=>v==='active').length;return `<div class="page"><h1>Status</h1><div class="hero"><span class="big ${online?'':'off'}">${svg(online?'check':'x')}</span><div><h2>${online?'Connected to '+esc(status.carrier):esc(status.registration||'Checking modem')}</h2><p>${online?esc(status.registration)+' · '+esc(status.technology):esc(status.sim_status||'Reading SIM')}</p></div></div><div class="tiles"><div class="tile"><div class="k">Signal</div><div class="sigbars" aria-label="${esc(status.signal||0)} percent">${bars}</div><div class="v" id="signal-value" style="font-size:20px;margin:0">${esc(status.signal||0)}<small>%</small></div></div><div class="tile"><div class="k">Message history</div><div class="v">${allMessages.length}</div><div class="k">${incoming} received · ${outgoing} sent</div></div><div class="tile"><div class="k">Services</div><div class="v">${active}<small>of ${services.length}</small></div><div class="bar"><b style="width:${services.length?100*active/services.length:0}%;background:var(--green)"></b></div></div><div class="tile"><div class="k">Mobile data</div><div class="v compact">${dataOn()?'On':'Off'}</div><div class="k">${dataOn()?'Cellular internet enabled':'Wi-Fi for internet'}</div></div></div>${title('Device')}<div class="group">${row('Carrier',status.carrier)}${row('Registration',status.registration)}${row('SIM',status.sim_status)}${row('Phone number',status.phone_number,'phone-number')}${row('Home network',status.sim_home_operator,'sim-home-operator')}${row('Radio',status.technology)}${row('APN',status.apn)}${row('APN selection',status.apn_mode)}${row('Carrier profile',status.carrier_profile,'carrier-profile')}</div>${title('Services')}<div class="group">${services.map(([name,v])=>`<div class="row"><span class="grow t">${esc(name)}</span><span class="tag ${v==='active'?'ok':'fail'}">${esc(v)}</span></div>`).join('')}</div><button class="btn" id="refresh-status">Refresh status</button><p class="updated">${status.updated_at?'Updated '+esc(time(new Date(status.updated_at*1000).toISOString())):'Waiting for status'}</p></div>`}

const pushState={enabled:false,loading:true,public_key:'',device_id:readLocal('dji-push-device',''),error:''};

function pushAvailable(){return window.isSecureContext&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function notificationSettings(){const hint=!window.isSecureContext?'Open the HTTPS address to enable push notifications.':!pushAvailable()?'On iPhone, open this app from your Home Screen. Use iOS 16.4 or later.':Notification.permission==='denied'?'Notifications are blocked. Allow them in your device notification settings.':pushState.error||'Push applies to this device. Telegram applies to the gateway. You can use either or both.';return title('Destinations')+`<div class="group"><div class="row">${icon('send','#32ade6')}<span class="grow"><span class="t">Telegram</span><span class="s">${config.telegram_configured?'Forward incoming SMS to your bot':'Configure your Telegram bot'}</span></span>${sw(config.telegram_configured&&config.telegram_enabled!==false,'data-telegram-toggle aria-label="Telegram notifications"')}</div><button class="row" data-edit="telegram"><span class="grow t">Telegram setup</span><span class="meta">${config.telegram_configured?'Chat '+esc(config.chat_id):'Not set up'}</span>${chev}</button><div class="row">${icon('bell','var(--red)')}<span class="grow"><span class="t">Push notifications</span><span class="s">${pushState.loading?'Checking this device…':pushState.enabled?'Enabled on this device':'Off on this device'}</span></span>${sw(pushState.enabled,'data-push-toggle aria-label="Push notifications" '+(pushState.loading?'disabled':''))}</div>${pushState.enabled?'<button class="row" id="push-test"><span class="grow t" style="color:var(--blue)">Send test notification</span>'+chev+'</button>':''}</div><p class="sec-foot">${esc(hint)}</p>`}
function decodeApplicationKey(value){const raw=atob(value.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-value.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
async function getPushConfig(){const response=await fetch('/api/push?device_id='+encodeURIComponent(pushState.device_id),{cache:'no-store'}),value=await response.json();if(!response.ok)throw new Error(value.error||'Push service is unavailable.');pushState.public_key=value.public_key;pushState.enabled=!!value.enabled;return value}
async function initialisePush(){try{if(!pushAvailable())return;pushRegistration=await navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'});await navigator.serviceWorker.ready;await getPushConfig();const subscription=await pushRegistration.pushManager.getSubscription();if(!subscription||Notification.permission!=='granted')pushState.enabled=false}catch(error){pushState.error=error.message}finally{pushState.loading=false;if(S.tab==='forwarding')render()}}
async function togglePush(){if(!pushAvailable()){toast(!window.isSecureContext?'Open the HTTPS address first.':'Add this app to your iPhone Home Screen, then open it there.');return}if(S.busy)return;S.busy=true;try{if(pushState.enabled){await post('/api/push/unsubscribe',{device_id:pushState.device_id});pushState.enabled=false;toast('Push notifications off on this device.')}else{if(Notification.permission==='denied')throw new Error('Allow notifications for SMS Forwarder in your device Settings.');const permission=Notification.permission==='granted'?'granted':await Notification.requestPermission();if(permission!=='granted')throw new Error('Notifications were not allowed.');pushRegistration=pushRegistration||await navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'});await navigator.serviceWorker.ready;await getPushConfig();let subscription=await pushRegistration.pushManager.getSubscription();if(!subscription)subscription=await pushRegistration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:decodeApplicationKey(pushState.public_key)});const result=await post('/api/push/subscribe',{subscription:JSON.stringify(subscription.toJSON())});pushState.device_id=result.device_id;pushState.enabled=true;pushState.error='';saveLocal('dji-push-device',result.device_id);toast('Push notifications enabled on this device.')}}catch(error){pushState.error=error.message;toast(error.message)}finally{S.busy=false;render()}}

function settingsView(){return `<div class="page"><h1>Settings</h1>${title('General')}<div class="group"><button class="row" data-edit="access">${icon('gear','var(--blue)')}<span class="grow t">Dashboard access</span><span class="meta">${esc(config.username)}</span>${chev}</button><button class="row" data-edit="hardware">${icon('pulse','#8e8e93')}<span class="grow t">Hardware</span><span class="meta">${esc(status.modem_state||'Checking')}</span>${chev}</button></div>${title('Appearance')}<div class="seg" role="group" aria-label="Appearance">${['auto','light','dark'].map(t=>`<button data-theme="${t}" aria-pressed="${S.theme===t}">${t==='auto'?'Automatic':t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><form method="post" action="/logout"><input type="hidden" name="csrf" value="${esc(csrf)}"><button class="btn danger">Sign out</button></form></div>`}
function render(){if(swipeGesture){swipeNeedsRender=true;return}openSwipe=null;const scroll=main.scrollTop;renderNav();main.innerHTML=({messages:messagesView,forwarding:forwardingView,status:statusView,settings:settingsView}[S.tab])();main.scrollTop=scroll}
function openSheet(content,kind){lastFocus=document.activeElement;S.sheet=kind;sheet.innerHTML=content;sheet.classList.add('show');sheet.setAttribute('aria-hidden','false');document.getElementById('scrim').classList.add('show');app.inert=true;sheet.querySelector('button,input,textarea')?.focus()}
function closeSheet(){sheet.classList.remove('show');sheet.setAttribute('aria-hidden','true');document.getElementById('scrim').classList.remove('show');app.inert=false;S.sheet=null;S.peer=null;editingMessages=false;selectedMessages.clear();lastFocus?.isConnected?lastFocus.focus():main.focus()}
function sheetBar(name,left=''){return `<div class="sheet-bar">${left||'<span style="width:60px"></span>'}<b id="sheet-title">${esc(name)}</b><button class="link bold" data-close>Done</button></div>`}
function markRead(peer){delete S.manualUnread[peer];saveLocal('dji-unread-v1',S.manualUnread);const ids=allMessages.filter(m=>m.peer===peer&&m.direction==='incoming').map(m=>Number(m.id));if(ids.length)S.read[peer]=Math.max(...ids);saveLocal('dji-read-v1',S.read)}
function messageBlocks(items,ids=new Set()){let day='';return items.map(m=>{const d=date(m.timestamp),label=Number.isNaN(d.getTime())?'':d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});const stamp=label!==day?`<div class="stamp">${esc(label)}</div>`:'';day=label;return stamp+`<div class="message-item ${m.direction==='outgoing'?'outgoing':''}">${editingMessages&&!m.pending?`<button class="message-select" role="checkbox" aria-checked="${selectedMessages.has(m.id)}" aria-label="Select message: ${esc(m.body.slice(0,60))}" data-select-message="${m.id}">${selectedMessages.has(m.id)?svg('check'):''}</button>`:''}<div class="msg ${m.direction==='outgoing'?'outgoing':''} ${m.pending?'pending':''} ${ids.has(m.id)?'new-message-animation':''}">${esc(m.body)}<span class="msg-time">${m.pending?'Sending…':esc(time(m.timestamp))}</span></div></div>`}).join('')}
function openConvo(peer){editingMessages=false;selectedMessages.clear();S.peer=peer;markRead(peer);render();const items=groups().find(c=>c.peer===peer)?.items||[];openSheet(sheetBar(phone(peer),'<button class="link" id="edit-messages">Edit</button>')+`<div class="sheet-body" id="message-stream"><div class="group">${row('Number',peer)}${row('Messages',String(items.length))}</div><div class="bubbles" id="thread-bubbles">${messageBlocks(items)}</div></div><button class="jump" id="jump-latest" hidden>Latest message</button><p class="error-inline" id="send-error" hidden></p><div id="delete-toolbar" class="delete-toolbar" hidden><button id="delete-conversation">Delete conversation</button><button id="delete-selected" disabled>Delete selected</button></div><form class="composer" id="reply-form"><textarea name="message" rows="1" maxlength="670" placeholder="Message" aria-label="Message" required></textarea><button aria-label="Send"><svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v14"/></svg></button></form>`,'conversation');requestAnimationFrame(()=>{const s=document.getElementById('message-stream');s.scrollTop=s.scrollHeight})}
function updateConvo(ids=new Set()){if(S.sheet!=='conversation')return;const stream=document.getElementById('message-stream'),preserveScroll=stream.scrollHeight-stream.scrollTop-stream.clientHeight>70,top=stream.scrollTop,items=groups().find(c=>c.peer===S.peer)?.items||[];document.getElementById('thread-bubbles').innerHTML=messageBlocks(items,ids);stream.querySelector('.group .row:last-child .meta').textContent=String(items.length);stream.scrollTop=preserveScroll?top:stream.scrollHeight;document.getElementById('jump-latest').hidden=!preserveScroll;markRead(S.peer);renderNav()}
function openNew(){openSheet(sheetBar('New message','<button class="link" data-close>Cancel</button>')+`<div class="sheet-body"><form id="new-form"><div class="group">${formRow('To','number','','tel','Phone number')}<textarea name="message" class="multiline-field" maxlength="670" aria-label="Message" placeholder="Message" required></textarea></div><p class="error-inline" id="new-error" hidden></p><button class="btn" type="submit">Send message</button></form></div>`,'new')}
function openEdit(kind){if(kind==='telegram'){openSheet(sheetBar('Telegram')+`<div class="sheet-body"><form id="telegram-form"><div class="group">${formRow('Bot token','token','','password',config.telegram_configured?'Saved — leave blank to keep':'From @BotFather')}${formRow('Chat ID','chat_id',config.chat_id,'text','Authorized chat ID')}</div><p class="sec-foot">Send your bot a message, then choose Find chat ID. Quote a forwarded SMS to send a reply from the SIM.</p><div id="telegram-result" role="status"></div><button class="btn" name="action" value="save">Save settings</button><button class="btn" name="action" value="test">Send test message</button><button class="btn" name="action" value="discover">Find chat ID</button></form></div>`,'telegram')}
else if(kind==='access'){openSheet(sheetBar('Dashboard access')+`<div class="sheet-body"><form id="access-form"><div class="group">${formRow('Username','username',config.username)}${formRow('Password','password','','password','New password')}${formRow('Confirm','confirmation','','password','Repeat password')}</div><p class="sec-foot">Use a username of 3–32 characters and a password of at least 6 characters.</p><p class="error-inline" id="access-status" hidden></p><button class="btn">Change login</button></form></div>`,'access')}
else{openSheet(sheetBar('Hardware')+`<div class="sheet-body"><div class="group">${row('Modem state',status.modem_state)}${row('Firmware',status.firmware,'firmware')}${row('Carrier profile',status.carrier_profile)}${row('AT interface',config.at_interface)}${row('Audio interface',config.audio_interface)}</div></div>`,'hardware')}}
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({csrf,...data})});if(r.status===401){location.href='/login';throw new Error('Sign in to continue.')}const type=r.headers.get('Content-Type')||'';if(type.includes('application/json')){const x=await r.json();if(!r.ok)throw new Error(x.error||'Request failed.');return x}const doc=new DOMParser().parseFromString(await r.text(),'text/html'),notices=[...doc.querySelectorAll('.notice')];const result=notices.map(e=>e.textContent.trim()).join('\n');if(!r.ok||result.startsWith('Error:'))throw new Error(result||'Request failed.');return {text:result,notices}}
async function send(number,body){const result=await post('/api/sms',{number,message:body});if(!allMessages.some(m=>m.id===result.message.id))allMessages.push(result.message);if(result.message.history_warning)toast(result.message.history_warning);return result.message}
async function fetchMessages(){if(fetchingMessages)return;fetchingMessages=true;const version=historyVersion;try{const r=await fetch('/messages',{cache:'no-store'});if(!r.ok)return;const next=await r.json();if(version!==historyVersion)return;const old=new Set(allMessages.map(m=>m.id)),ids=new Set(next.filter(m=>!old.has(m.id)).map(m=>m.id));if(JSON.stringify(next)!==JSON.stringify(allMessages)){allMessages=next;if(S.tab==='messages')render();updateConvo(ids);if(ids.size)document.getElementById('announcer').textContent='New messages received'}}catch(_){}finally{fetchingMessages=false}}
function refreshDeleteControls(){const button=document.getElementById('delete-selected');button.disabled=!selectedMessages.size;button.textContent=selectedMessages.size?`Delete (${selectedMessages.size})`:'Delete selected'}

function confirmMessageDeletion(conversation,count){return new Promise(resolve=>{const dialog=document.createElement('dialog'),previousFocus=document.activeElement;dialog.className='message-delete-sheet';dialog.setAttribute('aria-labelledby','message-delete-title');const label=conversation?'Delete Conversation':count===1?'Delete Message':`Delete ${count} Messages`;dialog.innerHTML=`<form method="dialog"><div class="message-delete-group"><div class="message-delete-copy"><h2 id="message-delete-title">${label}?</h2><p>${conversation?'This conversation will be deleted from the gateway. Messages already forwarded to Telegram will remain there.':'These messages will be deleted from the gateway. This cannot be undone.'}</p></div><button value="delete">${label}</button></div><button class="delete-cancel" value="cancel" autofocus>Cancel</button></form>`;dialog.addEventListener('close',()=>{const confirmed=dialog.returnValue==='delete';dialog.remove();if(previousFocus?.isConnected)previousFocus.focus();resolve(confirmed)},{once:true});dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close('cancel')});document.body.append(dialog);dialog.showModal()})}

async function removeMessages(conversation,peer=S.peer){if(S.busy)return;const items=allMessages.filter(m=>m.peer===peer),ids=[...selectedMessages];if(!items.length||!conversation&&!ids.length)return;const before_id=String(Math.max(...items.map(m=>Number(m.id))));if(!await confirmMessageDeletion(conversation,ids.length))return;S.busy=true;historyVersion++;try{const result=await post('/api/messages/delete',conversation?{peer,before_id}:{ids:ids.join(',')});historyVersion++;allMessages=result.messages;selectedMessages.clear();if(S.sheet==='conversation'&&S.peer===peer){if(!allMessages.some(m=>m.peer===peer))closeSheet();else{updateConvo();refreshDeleteControls()}}render();toast(result.deleted===1?'Message deleted':`${result.deleted} messages deleted`)}catch(error){toast(error.message)}finally{S.busy=false}}

function toggleConversationRead(peer){const c=groups().find(c=>c.peer===peer);if(!c)return;const wasUnread=unread(c);if(wasUnread)markRead(peer);else{S.manualUnread[peer]=true;saveLocal('dji-unread-v1',S.manualUnread)}closeConversationSwipe();render();toast(wasUnread?'Marked as read':'Marked as unread')}
function paintConversationSwipe(card,delta,revealed=false){card.dataset.swipe=delta>0?'read':delta<0?'delete':'';card.querySelector('.row.convo').style.transform=`translateX(${delta}px)`;card.classList.toggle('revealed',revealed);for(const action of card.querySelectorAll('.swipe-action')){const visible=revealed&&action.classList.contains(delta>0?'read':'delete');action.setAttribute('aria-hidden',String(!visible));action.querySelector('button').tabIndex=visible?0:-1}}
function closeConversationSwipe(){if(openSwipe?.card.isConnected){paintConversationSwipe(openSwipe.card,0);openSwipe.card.classList.remove('commit-ready','dragging')}openSwipe=null}
function revealConversationSwipe(card,direction){closeConversationSwipe();const delta=direction==='read'?88:-88;paintConversationSwipe(card,delta,true);openSwipe={card,delta}}
document.addEventListener('pointerdown',e=>{if(e.isPrimary===false||e.button!==0||S.busy)return;const card=e.target.closest('.convo-card');if(!card){if(openSwipe)closeConversationSwipe();return}if(e.target.closest('.swipe-action'))return;if(openSwipe&&openSwipe.card!==card)closeConversationSwipe();swipeGesture={card,peer:card.dataset.peer,pointerId:e.pointerId,x:e.clientX,y:e.clientY,initial:openSwipe?.card===card?openSwipe.delta:0,delta:0,axis:null};});
document.addEventListener('pointermove',e=>{const g=swipeGesture;if(!g||e.pointerId!==g.pointerId)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(!g.axis){if(Math.max(Math.abs(dx),Math.abs(dy))<10)return;if(Math.abs(dy)>Math.abs(dx)*.85){g.axis='vertical';return}g.axis='horizontal';g.card.classList.add('dragging');g.card.querySelector('.row.convo').setPointerCapture(e.pointerId)}if(g.axis!=='horizontal')return;e.preventDefault();const raw=g.initial+dx,amount=Math.abs(raw),resisted=amount<=88?amount:88+(amount-88)*.82;g.delta=Math.sign(raw)*Math.min(g.card.clientWidth*.9,resisted);paintConversationSwipe(g.card,g.delta);g.card.classList.toggle('commit-ready',Math.abs(g.delta)>=Math.max(140,g.card.clientWidth*.5));},{passive:false});
function endConversationSwipe(e,cancelled=false){const g=swipeGesture;if(!g||e.pointerId!==g.pointerId)return;swipeGesture=null;g.card.classList.remove('dragging','commit-ready');if(g.axis==='horizontal'){suppressSwipeClickUntil=Date.now()+450;const full=!cancelled&&Math.abs(g.delta)>=Math.max(140,g.card.clientWidth*.5);if(full){closeConversationSwipe();paintConversationSwipe(g.card,0);if(g.delta>0)toggleConversationRead(g.peer);else removeMessages(true,g.peer)}else if(!cancelled&&Math.abs(g.delta)>34)revealConversationSwipe(g.card,g.delta>0?'read':'delete');else{closeConversationSwipe();paintConversationSwipe(g.card,0)}}if(swipeNeedsRender){swipeNeedsRender=false;render()}}
document.addEventListener('pointerup',e=>endConversationSwipe(e));
document.addEventListener('pointercancel',e=>endConversationSwipe(e,true));
document.addEventListener('click',e=>{const card=e.target.closest('.convo-card');if(!card)return;if(Date.now()<suppressSwipeClickUntil&&!e.target.closest('.swipe-action')){e.preventDefault();e.stopImmediatePropagation();return}if(openSwipe?.card===card&&e.target.closest('.row.convo')){closeConversationSwipe();e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('keydown',e=>{const card=e.target.closest('.convo-card');if(!card)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();revealConversationSwipe(card,e.key==='ArrowRight'?'read':'delete');card.querySelector('.swipe-action.'+(e.key==='ArrowRight'?'read':'delete')+' button').focus()}else if(e.key==='Escape'){closeConversationSwipe();card.querySelector('.row.convo').focus()}});

async function fetchStatus(){if(fetchingStatus)return;fetchingStatus=true;try{const r=await fetch('/api/status',{cache:'no-store'});if(r.ok){status=await r.json();if(S.tab!=='messages')render()}}catch(_){}finally{fetchingStatus=false}}
document.addEventListener('input',e=>{if(e.target.id==='conversation-search'){const input=e.target,pos=input.selectionStart;S.q=input.value;render();const replacement=document.getElementById('conversation-search');replacement.focus();try{replacement.setSelectionRange(pos,pos)}catch(_){}}if(e.target.closest('#reply-form')&&e.target.tagName==='TEXTAREA'){e.target.style.height='38px';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'}});
document.addEventListener('scroll',e=>{if(e.target.id==='message-stream'){const s=e.target,jump=document.getElementById('jump-latest');if(jump)jump.hidden=s.scrollHeight-s.scrollTop-s.clientHeight<80}},true);
document.addEventListener('click',async e=>{const b=e.target.closest('button,#scrim');if(!b)return;if(b.dataset.tab){S.tab=b.dataset.tab;history.replaceState(null,'',S.tab==='messages'?'#conversations':'#'+S.tab);render();main.scrollTop=0;if(S.tab==='status')fetchStatus()}
else if(b.dataset.filter){S.filter=b.dataset.filter;render()}
else if(b.dataset.toggleRead)toggleConversationRead(b.dataset.toggleRead);
else if(b.dataset.deletePeer){closeConversationSwipe();await removeMessages(true,b.dataset.deletePeer)}
else if(b.dataset.open)openConvo(b.dataset.open);
else if(b.id==='edit-messages'){if(S.busy)return;editingMessages=!editingMessages;selectedMessages.clear();b.textContent=editingMessages?'Cancel':'Edit';document.getElementById('reply-form').hidden=editingMessages;document.getElementById('delete-toolbar').hidden=!editingMessages;const s=document.getElementById('message-stream'),top=s.scrollTop;updateConvo();s.scrollTop=top;refreshDeleteControls()}
else if(b.dataset.selectMessage){const id=Number(b.dataset.selectMessage);selectedMessages.has(id)?selectedMessages.delete(id):selectedMessages.add(id);b.setAttribute('aria-checked',selectedMessages.has(id));b.innerHTML=selectedMessages.has(id)?svg('check'):'';refreshDeleteControls()}
else if(b.id==='delete-selected')await removeMessages(false);
else if(b.id==='delete-conversation')await removeMessages(true);
else if(b.id==='new-message')openNew();
else if(b.hasAttribute('data-push-toggle'))await togglePush();
else if(b.hasAttribute('data-telegram-toggle')){if(!config.telegram_configured){openEdit('telegram');return}b.disabled=true;try{const enabled=config.telegram_enabled===false;const result=await post('/api/notifications',{telegram:enabled?'on':'off'});config.telegram_enabled=result.telegram_enabled;render();toast('Telegram notifications '+(result.telegram_enabled?'on':'off'))}catch(error){toast(error.message)}finally{b.disabled=false}}
else if(b.id==='push-test'){b.disabled=true;try{await post('/api/push/test',{device_id:pushState.device_id});toast('Test notification sent to this device.')}catch(error){toast(error.message)}finally{b.disabled=false}}
else if(b.dataset.edit)openEdit(b.dataset.edit);
else if(b.dataset.close!==undefined||b.id==='scrim')closeSheet();
else if(b.dataset.theme){S.theme=b.dataset.theme;saveLocal('dji-theme',S.theme);applyTheme();render()}
else if(b.id==='refresh-status'){await fetchStatus();toast('Status updated')}
else if(b.id==='jump-latest'){const s=document.getElementById('message-stream');s.scrollTo({top:s.scrollHeight,behavior:'smooth'});b.hidden=true}
else if(b.hasAttribute('data-data')){b.disabled=true;try{const on=!dataOn();await post('/data',{state:on?'on':'off'});await fetchStatus();toast('Mobile data '+(on?'enabled':'disabled'))}catch(error){toast(error.message)}finally{b.disabled=false}}});
document.addEventListener('submit',async e=>{const form=e.target;if(!['reply-form','new-form','telegram-form','access-form'].includes(form.id))return;e.preventDefault();if(S.busy)return;S.busy=true;const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{if(form.id==='reply-form'){const peer=S.peer,body=form.elements.message.value.trim();if(!body)return;const temp={id:Date.now(),timestamp:new Date().toISOString(),peer,body,direction:'outgoing',pending:true};pending.push(temp);form.elements.message.value='';updateConvo(new Set([temp.id]));try{await send(peer,body)}catch(error){form.elements.message.value=body;throw error}finally{pending=pending.filter(m=>m!==temp);updateConvo();if(S.tab==='messages')render()}}
else if(form.id==='new-form'){const number=form.elements.number.value.trim(),body=form.elements.message.value.trim();if(!number||!body)throw new Error('Enter a number and message.');const saved=await send(number,body);S.tab='messages';render();openConvo(saved.peer)}
else if(form.id==='telegram-form'){const token=form.elements.token.value.trim(),chat_id=form.elements.chat_id.value.trim(),action=e.submitter?.value||'save',result=await post('/telegram',{token,chat_id,action});const container=document.getElementById('telegram-result');container.replaceChildren();for(const original of result.notices){const note=document.createElement('div');note.className='notice';note.textContent=original.textContent;container.append(note)}if(action==='save'){config.telegram_configured=true;config.chat_id=chat_id;form.elements.token.value='';render();fetchStatus()}toast(action==='test'?'Test message sent':action==='save'?'Telegram settings saved':'Chat discovery complete')}
else if(form.id==='access-form'){await post('/api/access',{username:form.elements.username.value,password:form.elements.password.value,confirmation:form.elements.confirmation.value});toast('Login changed. Sign in with your new credentials.');setTimeout(()=>location.href='/login',1200)}}catch(error){const target=document.getElementById(form.id==='reply-form'?'send-error':form.id==='new-form'?'new-error':form.id==='access-form'?'access-status':'telegram-result');if(target){target.textContent=error.message;target.hidden=false}else toast(error.message)}finally{S.busy=false;buttons.forEach(b=>b.disabled=false)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet();if(e.key==='Tab'&&S.sheet){const focus=[...sheet.querySelectorAll('button,input,textarea,select')].filter(n=>!n.disabled);if(!focus.length)return;const first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'&&!S.sheet){e.preventDefault();openNew()}});
render();initialisePush();const notificationPeer=new URLSearchParams(location.hash.split('?')[1]||'').get('peer');if(notificationPeer&&allMessages.some(m=>m.peer===notificationPeer)){S.tab='messages';render();openConvo(notificationPeer)}setInterval(fetchMessages,4000);setInterval(fetchStatus,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){fetchMessages();fetchStatus()}});

const notices=document.getElementById('server-notices').content;if(notices.childNodes.length)main.prepend(notices.cloneNode(true));</script></body></html>
